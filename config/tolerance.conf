# ============================================================
# tolerance 自适应降级配置
# ============================================================
# 【工作原理】
# 每5分钟检测一次 AUTO 组是否切换了节点。
# 如果连续多次都没切换（说明当前节点一直"够用"），
# 就自动降低 tolerance 值，让 AUTO 组更敏感、
# 更容易切换到更快的节点。
#
# 一旦节点切换了，立即恢复最宽松的初始状态。
#
# 【各级含义】
# 初始状态: 连续10次(50分钟)不切换才触发降级，tolerance=50ms
# 第1级降级: 连续8次(40分钟)不切换再次降级，tolerance=35ms
# 第2级降级: 连续5次(25分钟)不切换，降到最低，tolerance=20ms
# ============================================================

# 初始状态（最宽松，不容易切换）
LEVEL0_COUNT=10
LEVEL0_TOLERANCE=100

# 第1级降级（中等敏感）
LEVEL1_COUNT=8
LEVEL1_TOLERANCE=80

# 第2级降级（最敏感，最低）
LEVEL2_COUNT=5
LEVEL2_TOLERANCE=60
